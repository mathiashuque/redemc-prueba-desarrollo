name: CD

# Automático en cada push a main. Manual (Actions → CD → Run workflow) desde main o develop.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: Rama permitida
    runs-on: ubuntu-latest
    steps:
      - name: Verificar rama
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF" != "refs/heads/main" ] && [ "$REF" != "refs/heads/develop" ]; then
            echo "::error::El CD solo se ejecuta desde main o develop (rama actual: $REF_NAME)."
            exit 1
          fi

  ci:
    name: CI
    needs: guard
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy a Railway
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.config.outputs.app_url }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v7
      - name: Verificar configuración
        id: config
        run: |
          missing=""
          [ -n "$RAILWAY_TOKEN" ] || missing="$missing RAILWAY_TOKEN(secret)"
          [ -n "$RAILWAY_SERVICE" ] || missing="$missing RAILWAY_SERVICE(variable)"
          [ -n "$APP_URL" ] || missing="$missing APP_URL(variable)"
          if [ -n "$missing" ]; then
            echo "::error::Falta configurar en GitHub:$missing. Ver README, sección Railway."
            exit 1
          fi
          # Acepta APP_URL con o sin esquema y con o sin barra final.
          url="${APP_URL%/}"
          case "$url" in
            http://*|https://*) ;;
            *) url="https://$url" ;;
          esac
          echo "app_url=$url" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Instalar Railway CLI
        run: npm install --global @railway/cli
      - name: Desplegar
        run: railway up --ci --service "$RAILWAY_SERVICE"
      - name: Smoke test
        env:
          APP_URL: ${{ steps.config.outputs.app_url }}
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS "$APP_URL/api/health.php"; then
              echo
              exit 0
            fi
            sleep 10
          done
          echo "::error::$APP_URL/api/health.php no respondió OK"
          exit 1
