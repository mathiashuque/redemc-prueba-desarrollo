name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.4"
  NODE_VERSION: "24"
  TRIVY_IMAGE: aquasec/trivy:0.76.1

jobs:
  php:
    name: PHP (lint, PHPCS, PHPStan, tests unitarios)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_mysql
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer lint
      - run: composer cs
      - run: composer stan
      - run: composer test

  frontend:
    name: Frontend (ESLint, Stylelint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  integration:
    name: Integración con MySQL
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.13
        env:
          MYSQL_DATABASE: redemc
          MYSQL_USER: redemc
          MYSQL_PASSWORD: redemc
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: redemc
      DB_USER: redemc
      DB_PASSWORD: redemc
      APP_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_mysql
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - name: Aplicar esquema
        run: php bin/migrate.php
      - name: Levantar la app
        run: |
          php -S 127.0.0.1:8000 -t public > /tmp/php-server.log 2>&1 &
          for _ in $(seq 1 20); do
            curl -s -o /dev/null "$APP_URL/" && exit 0
            sleep 1
          done
          echo "::error::La app no levantó"
          exit 1
      - run: composer test:integration
      - name: Log del servidor
        if: failure()
        run: cat /tmp/php-server.log

  docker:
    name: Imagen Docker de producción
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Construir imagen
        run: docker build -t redemc:ci .
      - name: Probar que respeta $PORT
        run: |
          docker run -d --name app -p 9000:9000 -e PORT=9000 -e RUN_MIGRATIONS=0 redemc:ci
          for _ in $(seq 1 20); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/)" = "200" ]; then
              exit 0
            fi
            sleep 1
          done
          docker logs app
          exit 1

  security:
    name: Seguridad (dependencias e imagen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2
      - name: composer audit
        run: composer audit --locked
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit
        run: npm audit --audit-level=high
      - name: Construir imagen de producción
        run: docker build -t redemc:scan .
      # Trivy corre desde su imagen oficial con versión fija, sin actions de terceros.
      - name: Trivy - vulnerabilidades de la imagen
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 redemc:scan
      - name: Trivy - configuración (Dockerfile, compose)
        run: |
          docker run --rm -v "$PWD:/src:ro" "$TRIVY_IMAGE" \
            config --severity HIGH,CRITICAL --exit-code 1 /src
