# Propone actualizaciones de dependencias, imágenes y actions con PRs semanales a develop.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
